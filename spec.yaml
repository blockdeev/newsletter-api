name: zero2prod
region: nyc

services:
  - name: zero2prod
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      branch: main
      deploy_on_push: false
      repo: blockdeev/zero2prod
    health_check:
      http_path: /health_check
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
