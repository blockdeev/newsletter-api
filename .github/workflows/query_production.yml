name: Query production database

on:
  workflow_dispatch:

jobs:
  query:
    name: Run a SELECT against production DB
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Query subscriptions
        run: psql "$DATABASE_URL" -c "SELECT id, email, name, subscribed_at FROM subscriptions;"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
